<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>secreT — para ABBY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital@0;1&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/index.css" />
  <link rel="stylesheet" href="../css/secreto.css" />
</head>
<body>

  <div id="particles" aria-hidden="true"></div>

  <a class="secreto-back" href="index.html" aria-label="Volver a la playlist">
    <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    <span>volver</span>
  </a>

  <main class="secreto-page">
    <header class="secreto-hero">
      <p class="section-eyebrow">un secreto para ti</p>
      <h1 class="secreto-title">Tanjiro Kamado</h1>
      <p class="secreto-subtitle">un rincón aparte, solo porque tú también amas Demon Slayer.</p>
    </header>

    <div class="secreto-gallery" id="secretoGallery"></div>
  </main>

  <button class="ambient-btn" id="ambientBtn" aria-label="Música de fondo">
    <svg id="ambientPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="ambientPauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>

  <!-- ===== visor de imagen ===== -->
  <div class="lightbox-backdrop" id="lightboxBackdrop">
    <button class="panel-close lightbox-close" id="lightboxClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="" />
  </div>

  <audio id="ambientAudio" preload="none"></audio>

  <script src="../js/particles.js"></script>
  <script src="../js/secreto.js"></script>
</body>
</html>
